<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🌟 宝宝学习乐园</title>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--pink:#FF6B8A;--blue:#5B9EFF;--green:#4ECB71;--yellow:#FFC048;--purple:#A78BFA;--orange:#FF8C52;--red:#E85D5D;--card-shadow:0 4px 16px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#FFF5F5,#F0F4FF,#FFF9F0);min-height:100vh;min-height:100dvh;overflow-x:hidden;user-select:none;-webkit-user-select:none}
.header{text-align:center;padding:16px 16px 12px;color:#fff;border-radius:0 0 30px 30px;box-shadow:0 4px 20px rgba(255,107,138,.3);transition:background .4s}
.header.en{background:linear-gradient(135deg,var(--pink),var(--purple))}
.header.cn{background:linear-gradient(135deg,var(--red),var(--orange))}
.header.math{background:linear-gradient(135deg,#12B76A,#34D399)}
.logo{font-size:24px;font-weight:800;letter-spacing:2px}
.sub-logo{font-size:12px;opacity:.85;margin-top:2px}

.lang-bar{display:flex;justify-content:center;gap:16px;padding:14px 16px;background:#fff;margin:12px 16px;border-radius:20px;box-shadow:var(--card-shadow)}
.lang-btn{flex:1;max-width:150px;padding:14px 10px;border:none;border-radius:16px;font-size:18px;font-weight:700;cursor:pointer;transition:all .3s}
.lang-btn.en{background:#F3F4F6;color:#888;border:2px solid #E5E7EB}
.lang-btn.cn{background:#F3F4F6;color:#888;border:2px solid #E5E7EB}
.lang-btn.math{background:#F3F4F6;color:#888;border:2px solid #E5E7EB}
.lang-btn.en.active{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(91,158,255,.4);transform:scale(1.05)}
.lang-btn.cn.active{background:linear-gradient(135deg,var(--red),var(--orange));color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(232,93,93,.4);transform:scale(1.05)}
.lang-btn.math.active{background:linear-gradient(135deg,#12B76A,#34D399);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(18,183,106,.4);transform:scale(1.05)}
.lang-btn:active{transform:scale(.93)}

.tab-bar{display:flex;justify-content:flex-start;gap:8px;padding:12px 12px;background:#fff;margin:0 16px;border-radius:20px;box-shadow:var(--card-shadow);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:62px;padding:11px 4px;border:none;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;background:#F3F4F6;color:#666;transition:all .3s;white-space:nowrap}
.tab.active.en-tab{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;box-shadow:0 4px 10px rgba(91,158,255,.35)}
.tab.active.cn-tab{background:linear-gradient(135deg,var(--red),var(--orange));color:#fff;box-shadow:0 4px 10px rgba(232,93,93,.35)}
.tab.active.math-tab{background:linear-gradient(135deg,#12B76A,#34D399);color:#fff;box-shadow:0 4px 10px rgba(18,183,106,.35)}
.tab:active{transform:scale(.93)}

.lang-panel{display:none}
.lang-panel.show{display:block}
.tab-panel{display:none;padding:0 12px 30px;animation:fadeIn .35s}
.tab-panel.active{display:block}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.1)}to{transform:scale(1);opacity:1}}
@keyframes bounce{0%,to{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes wiggle{0%,to{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}

/* 英语 */
.alphabet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding-top:8px}
.letter-card{aspect-ratio:1;background:#fff;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--card-shadow);transition:all .2s}
.letter-card:active{transform:scale(.9)}
.letter-card .letter{font-size:30px;font-weight:900}
.letter-card .letter-emoji{font-size:26px;margin-top:2px}
.letter-card .letter-word{font-size:10px;color:#888;margin-top:2px}
.letter-card:nth-child(8n+1) .letter{color:var(--pink)}.letter-card:nth-child(8n+2) .letter{color:var(--blue)}
.letter-card:nth-child(8n+3) .letter{color:var(--green)}.letter-card:nth-child(8n+4) .letter{color:var(--orange)}
.letter-card:nth-child(8n+5) .letter{color:var(--purple)}.letter-card:nth-child(8n+6) .letter{color:#F472B6}
.letter-card:nth-child(8n+7) .letter{color:#34D399}.letter-card:nth-child(8n+8) .letter{color:#FB923C}

.category-bar{display:flex;gap:8px;padding:8px 0 14px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.category-bar::-webkit-scrollbar{display:none}
.cat-btn{flex-shrink:0;padding:10px 16px;border:2px solid #E5E7EB;border-radius:20px;font-size:14px;font-weight:700;cursor:pointer;background:#fff;color:#555;transition:all .25s;white-space:nowrap}
.cat-btn.active{border-color:var(--blue);background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;box-shadow:0 3px 12px rgba(91,158,255,.35)}
.cat-btn:active{transform:scale(.93)}

.word-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.word-card{aspect-ratio:1;background:#fff;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--card-shadow);transition:all .2s;animation:popIn .4s both}
.word-card:active{transform:scale(.88)}
.word-card .word-emoji{font-size:40px}
.word-card .word-text{font-size:15px;font-weight:700;color:#333;margin-top:3px}
.word-card .word-mean{font-size:11px;color:#999}

/* 语文 - 拼音 */
.pinyin-section{margin-bottom:16px}
.pinyin-section-title{font-size:15px;font-weight:800;color:var(--red);margin:12px 0 8px;padding-left:4px}
.pinyin-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pinyin-card{aspect-ratio:1.2;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--card-shadow);font-size:18px;font-weight:700;color:#333;transition:all .2s;border:2px solid transparent}
.pinyin-card:active{transform:scale(.85);border-color:var(--red);background:#FFF1F0}

/* 语文 - 识字卡片 */
.char-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:8px}
.char-card{background:#fff;border-radius:18px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;cursor:pointer;box-shadow:var(--card-shadow);transition:all .2s}
.char-card:active{transform:scale(.93)}
.char-card .char-big{font-size:44px;font-weight:900;color:var(--red);line-height:1.1}
.char-card .char-picto{display:flex;align-items:center;gap:4px;margin:4px 0}
.char-card .picto-emoji{font-size:22px}
.char-card .picto-arrow{font-size:14px;color:#ccc}
.char-card .picto-char{font-size:22px;font-weight:700;color:#999}
.char-card .char-pinyin{font-size:14px;color:var(--blue);font-weight:700}

/* 语文 - 古诗 */
.poem-card{background:#fff;border-radius:20px;padding:20px 18px;margin-bottom:12px;box-shadow:var(--card-shadow);cursor:pointer;transition:all .2s}
.poem-card:active{transform:scale(.97)}
.poem-card .poem-title{font-size:20px;font-weight:900;color:var(--red)}
.poem-card .poem-author{font-size:13px;color:#999;margin-bottom:12px}
.poem-card .poem-line{font-size:20px;line-height:2;color:#333;text-align:center;letter-spacing:4px}
.poem-card .poem-play{display:block;margin:14px auto 0;padding:10px 28px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--red),var(--orange));color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.poem-card .poem-play:active{transform:scale(.9)}
/* 古诗年级分组 */
.grade-section{margin-bottom:8px}
.grade-header{background:#FFF9F0;padding:14px 16px;border-radius:16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:17px;font-weight:800;color:var(--red);transition:all .2s}
.grade-header:active{background:#FFE4D0}
.grade-header .grade-count{font-size:12px;font-weight:500;color:#999}
.grade-header .grade-arrow{font-size:14px;transition:transform .3s}
.grade-section.open .grade-arrow{transform:rotate(180deg)}
.grade-body{display:none;padding-top:6px}
.grade-section.open .grade-body{display:block}

/* 数学 - 认数字 */
.num-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding-top:8px}
.num-card{aspect-ratio:1;background:#fff;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--card-shadow);transition:all .2s}
.num-card:active{transform:scale(.88)}
.num-card .num-big{font-size:38px;font-weight:900;color:#12B76A;line-height:1}
.num-card .num-cn{font-size:14px;color:#555;font-weight:700;margin-top:3px}
.num-card .num-dots{font-size:9px;color:#94A3B8;margin-top:4px;letter-spacing:1px;line-height:1.4;text-align:center;max-width:90%}

/* 数学 - 加减法 */
.arith-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:8px}
.arith-card{background:#fff;border-radius:18px;padding:18px 10px;text-align:center;cursor:pointer;box-shadow:var(--card-shadow);transition:all .2s}
.arith-card:active{transform:scale(.92)}
.arith-card .arith-pic{font-size:26px;letter-spacing:2px;line-height:1.3;min-height:38px}
.arith-card .arith-expr{font-size:24px;font-weight:900;color:#0E9F6E;margin:6px 0}
.arith-card .arith-answer{font-size:20px;font-weight:800;color:#F59E0B}

/* 数学 - 图形 */
.shape-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:8px}
.shape-card{background:#fff;border-radius:18px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;cursor:pointer;box-shadow:var(--card-shadow);transition:all .2s}
.shape-card:active{transform:scale(.9)}
.shape-card .shape-emoji{font-size:44px;line-height:1.2}
.shape-card .shape-name{font-size:15px;font-weight:800;color:#333;margin-top:4px}
.shape-card .shape-desc{font-size:11px;color:#999;margin-top:1px}

/* 数学 - 测验 */
.math-quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:360px;margin:0 auto}
.math-quiz-opt{padding:16px 10px;font-size:22px;font-weight:800;border:3px solid #E5E7EB;border-radius:18px;background:#fff;cursor:pointer;color:#333;transition:all .25s;box-shadow:var(--card-shadow)}
.math-quiz-opt:active{transform:scale(.93)}
.math-quiz-opt.correct{border-color:var(--green);background:#D1FAE5;color:#065F46;animation:wiggle .3s}
.math-quiz-opt.wrong{border-color:var(--pink);background:#FFE4E6;color:#9B1C1C}
.quiz-next.math-next{background:linear-gradient(135deg,#12B76A,#34D399);box-shadow:0 4px 16px rgba(18,183,106,.35)}
.math-quiz-expr{font-size:52px;font-weight:900;color:#0E9F6E;margin:8px 0 18px;animation:bounce 1.5s ease infinite}

/* 数学 - 小节标题 */
.sec-title{font-size:15px;font-weight:800;color:#0E9F6E;margin:18px 4px 2px;padding-left:6px;border-left:4px solid #34D399}

/* 数学 - 乘法口诀 */
.times-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:8px}
.times-card{background:#fff;border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;box-shadow:var(--card-shadow);transition:all .2s}
.times-card:active{transform:scale(.9)}
.times-card .times-expr{font-size:19px;font-weight:900;color:#0E9F6E}
.times-card .times-read{font-size:11px;color:#999;margin-top:3px}

/* 数学 - 时钟 */
.clock-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:8px}
.clock-card{background:#fff;border-radius:16px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;cursor:pointer;box-shadow:var(--card-shadow);transition:all .2s}
.clock-card:active{transform:scale(.9)}
.clock-card .clock-face{line-height:0;margin:4px 0}
.clock-card .clock-face svg{display:block;margin:0 auto}
.clock-card .clock-time{font-size:17px;font-weight:900;color:#0E9F6E;margin-top:2px}
.clock-card .clock-read{font-size:12px;color:#999;margin-top:1px}

/* 测验 */
.quiz-container,.cn-quiz-container{text-align:center;padding-top:10px}
.quiz-score{font-size:20px;font-weight:800;color:var(--orange);margin-bottom:14px}
.quiz-question{font-size:17px;font-weight:700;color:#555;margin-bottom:6px}
.quiz-emoji{font-size:80px;margin:8px 0 18px;animation:bounce 1.5s ease infinite;filter:drop-shadow(0 8px 16px rgba(0,0,0,.12))}
.cn-quiz-char{font-size:90px;font-weight:900;color:var(--red);margin:10px 0 16px;animation:bounce 1.5s ease infinite}
.quiz-options,.cn-quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:360px;margin:0 auto}
.quiz-opt,.cn-quiz-opt{padding:16px 10px;font-size:16px;font-weight:700;border:3px solid #E5E7EB;border-radius:18px;background:#fff;cursor:pointer;color:#333;transition:all .25s;box-shadow:var(--card-shadow)}
.quiz-opt:active,.cn-quiz-opt:active{transform:scale(.93)}
.quiz-opt.correct,.cn-quiz-opt.correct{border-color:var(--green);background:#D1FAE5;color:#065F46;animation:wiggle .3s}
.quiz-opt.wrong,.cn-quiz-opt.wrong{border-color:var(--pink);background:#FFE4E6;color:#9B1C1C}
.quiz-feedback{font-size:20px;font-weight:800;margin:14px 0;min-height:30px}
.quiz-next{padding:14px 40px;font-size:17px;font-weight:700;border:none;border-radius:20px;color:#fff;cursor:pointer;box-shadow:0 4px 16px rgba(78,203,113,.4);transition:all .25s;margin-top:6px}
.quiz-next.en-next{background:linear-gradient(135deg,var(--green),#34D399)}
.quiz-next.cn-next{background:linear-gradient(135deg,var(--red),var(--orange));box-shadow:0 4px 16px rgba(232,93,93,.3)}
.quiz-next:active{transform:scale(.9)}

/* 对话 */
.dialogue-list{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.dialogue-card{background:#fff;border-radius:20px;box-shadow:var(--card-shadow);overflow:hidden;transition:all .3s;animation:fadeIn .4s both}
.dialogue-card.open{box-shadow:0 8px 30px rgba(0,0,0,.12)}
.dialogue-header{display:flex;align-items:center;gap:10px;padding:16px;cursor:pointer}
.dialogue-header:active{background:#F9FAFB}
.dialogue-emoji{font-size:34px}
.dialogue-title{flex:1;font-size:18px;font-weight:800;color:#333}
.dialogue-arrow{font-size:13px;color:#aaa}
.dialogue-card.open .dialogue-arrow{color:var(--purple)}
.dialogue-body{padding:0 14px 14px;border-top:2px dashed #F3F4F6;animation:fadeIn .3s}
.dialogue-line{display:flex;align-items:center;gap:8px;padding:10px 6px;border-radius:12px;margin-top:3px;cursor:pointer}
.dialogue-line:active{background:#F0F4FF}
.dl-speaker{font-size:26px;flex-shrink:0;width:32px;text-align:center}
.dl-content{flex:1;min-width:0}
.dl-en{display:block;font-size:15px;font-weight:700;color:#1F2937}
.dl-zh{display:block;font-size:12px;color:#9CA3AF;margin-top:2px}
.dl-speak{font-size:18px;flex-shrink:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#EEF2FF}
.dl-speak:active{background:var(--blue);transform:scale(.85)}
.dialogue-play-all{display:block;width:100%;margin-top:12px;padding:12px;font-size:16px;font-weight:700;border:none;border-radius:14px;background:linear-gradient(135deg,var(--purple),#C084FC);color:#fff;cursor:pointer}
.dialogue-play-all:active{transform:scale(.94)}

/* 弹窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-card{background:#fff;border-radius:28px;padding:12px 12px 22px 22px;text-align:center;width:90%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:popIn .4s;position:relative}
.modal-close{position:sticky;top:0;z-index:3;display:block;margin-left:auto;margin-right:-4px;width:32px;height:32px;font-size:20px;color:#aaa;cursor:pointer;border-radius:50%;background:#F3F4F6;line-height:32px;text-align:center}
.modal-scroll{overflow-y:auto;max-height:72vh;padding-right:10px}
.modal-emoji,.modal-char{font-size:70px;margin-bottom:4px;display:block}
.modal-word{font-size:32px;font-weight:900;color:#333}
.modal-pinyin{font-size:18px;color:var(--blue);margin-top:4px}
.modal-meaning{font-size:15px;color:#999;margin-top:4px}
.modal-picto{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0;padding:10px;background:#FFF9F0;border-radius:14px}
.modal-picto span{font-size:38px}
.modal-picto .arrow{font-size:24px;color:var(--orange)}
.modal-picto-label{font-size:11px;color:#aaa;text-align:center;margin-top:-6px;margin-bottom:8px}

/* Hanzi Writer 笔画容器 */
.hw-wrap{position:relative;margin:6px auto;width:200px;height:200px;border:2px dashed #F3F4F6;border-radius:16px;background:#FFFBF5;overflow:hidden}
.hw-wrap .hw-inner{width:100%;height:100%}
.hw-wrap .hw-inner svg{display:block}
.hw-step{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.hw-step .step-dot{width:22px;height:22px;border-radius:50%;background:#E5E7EB;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#999;transition:all .3s}
.hw-step .step-dot.done{background:var(--green);color:#fff}
.hw-step .step-dot.current{background:var(--red);color:#fff;transform:scale(1.3)}
.hw-btns{display:flex;gap:8px;justify-content:center;margin-top:8px}
.hw-btn{padding:8px 16px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.hw-btn.write{background:linear-gradient(135deg,var(--red),var(--orange));color:#fff}
.hw-btn.replay{background:#F3F4F6;color:#666}
.hw-btn:active{transform:scale(.9)}

.modal-speak{margin-top:10px;padding:12px 28px;font-size:16px;font-weight:700;border:none;border-radius:18px;color:#fff;cursor:pointer}
.modal-speak.en{background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 4px 14px rgba(91,158,255,.4)}
.modal-speak.cn{background:linear-gradient(135deg,var(--red),var(--orange));box-shadow:0 4px 14px rgba(232,93,93,.4)}
.modal-speak:active{transform:scale(.9)}

@media(min-width:600px){
.alphabet-grid,.char-grid{grid-template-columns:repeat(6,1fr);max-width:600px;margin:0 auto}
.word-grid{grid-template-columns:repeat(4,1fr);max-width:600px;margin:0 auto}
.tab-bar,.lang-bar{max-width:500px;margin-left:auto;margin-right:auto}
}
</style>
</head>
<body>

<header class="header en" id="header">
    <h1 class="logo" id="logo">🌟 宝宝学习乐园</h1>
    <div class="sub-logo" id="subLogo">英语启蒙 · 语文启蒙</div>
</header>

<nav class="lang-bar">
    <button class="lang-btn en active" id="langEn">🇬🇧 英语</button>
    <button class="lang-btn cn" id="langCn">🇨🇳 语文</button>
    <button class="lang-btn math" id="langMath">🧮 数学</button>
</nav>

<!-- ====== 英语面板 ====== -->
<div class="lang-panel show" id="panelEn">
    <nav class="tab-bar" id="enTabBar">
        <button class="tab active en-tab" data-en="alphabet">🔤字母</button>
        <button class="tab en-tab" data-en="category">📚单词</button>
        <button class="tab en-tab" data-en="quiz">🎮测验</button>
        <button class="tab en-tab" data-en="dialogue">💬对话</button>
    </nav>

{title:'所见',author:'清 · 袁枚',lines:['牧童骑黄牛，','歌声振林樾。','意欲捕鸣蝉，','忽然闭口立。']},
{title:'山行',author:'唐 · 杜牧',lines:['远上寒山石径斜，','白云生处有人家。','停车坐爱枫林晚，','霜叶红于二月花。']},
{title:'赠刘景文',author:'宋 · 苏轼',lines:['荷尽已无擎雨盖，','菊残犹有傲霜枝。','一年好景君须记，','正是橙黄橘绿时。']},
{title:'夜书所见',author:'宋 · 叶绍翁',lines:['萧萧梧叶送寒声，','江上秋风动客情。','知有儿童挑促织，','夜深篱落一灯明。']},
{title:'望天门山',author:'唐 · 李白',lines:['天门中断楚江开，','碧水东流至此回。','两岸青山相对出，','孤帆一片日边来。']},
{title:'饮湖上初晴后雨',author:'宋 · 苏轼',lines:['水光潋滟晴方好，','山色空蒙雨亦奇。','欲把西湖比西子，','淡妆浓抹总相宜。']},
{title:'望洞庭',author:'唐 · 刘禹锡',lines:['湖光秋月两相和，','潭面无风镜未磨。','遥望洞庭山水翠，','白银盘里一青螺。']},
{title:'早发白帝城',author:'唐 · 李白',lines:['朝辞白帝彩云间，','千里江陵一日还。','两岸猿声啼不住，','轻舟已过万重山。']},
{title:'采莲曲',author:'唐 · 王昌龄',lines:['荷叶罗裙一色裁，','芙蓉向脸两边开。','乱入池中看不见，','闻歌始觉有人来。']}
]},
{grade:'三年级下册',poems:[
{title:'绝句',author:'唐 · 杜甫',lines:['迟日江山丽，','春风花草香。','泥融飞燕子，','沙暖睡鸳鸯。']},
{title:'惠崇春江晚景',author:'宋 · 苏轼',lines:['竹外桃花三两枝，','春江水暖鸭先知。','蒌蒿满地芦芽短，','正是河豚欲上时。']},
{title:'三衢道中',author:'宋 · 曾几',lines:['梅子黄时日日晴，','小溪泛尽却山行。','绿阴不减来时路，','添得黄鹂四五声。']},
{title:'忆江南',author:'唐 · 白居易',lines:['江南好，风景旧曾谙。','日出江花红胜火，','春来江水绿如蓝。','能不忆江南？']},
{title:'元日',author:'宋 · 王安石',lines:['爆竹声中一岁除，','春风送暖入屠苏。','千门万户曈曈日，','总把新桃换旧符。']},
{title:'清明',author:'唐 · 杜牧',lines:['清明时节雨纷纷，','路上行人欲断魂。','借问酒家何处有？','牧童遥指杏花村。']},
{title:'九月九日忆山东兄弟',author:'唐 · 王维',lines:['独在异乡为异客，','每逢佳节倍思亲。','遥知兄弟登高处，','遍插茱萸少一人。']},
{title:'滁州西涧',author:'唐 · 韦应物',lines:['独怜幽草涧边生，','上有黄鹂深树鸣。','春潮带雨晚来急，','野渡无人舟自横。']},
{title:'大林寺桃花',author:'唐 · 白居易',lines:['人间四月芳菲尽，','山寺桃花始盛开。','长恨春归无觅处，','不知转入此中来。']}
]},
{grade:'四年级上册',poems:[
{title:'鹿柴',author:'唐 · 王维',lines:['空山不见人，','但闻人语响。','返景入深林，','复照青苔上。']},
{title:'暮江吟',author:'唐 · 白居易',lines:['一道残阳铺水中，','半江瑟瑟半江红。','可怜九月初三夜，','露似真珠月似弓。']},
{title:'题西林壁',author:'宋 · 苏轼',lines:['横看成岭侧成峰，','远近高低各不同。','不识庐山真面目，','只缘身在此山中。']},
{title:'雪梅',author:'宋 · 卢钺',lines:['梅雪争春未肯降，','骚人阁笔费评章。','梅须逊雪三分白，','雪却输梅一段香。']},
{title:'嫦娥',author:'唐 · 李商隐',lines:['云母屏风烛影深，','长河渐落晓星沉。','嫦娥应悔偷灵药，','碧海青天夜夜心。']},
{title:'出塞',author:'唐 · 王昌龄',lines:['秦时明月汉时关，','万里长征人未还。','但使龙城飞将在，','不教胡马度阴山。']},
{title:'凉州词',author:'唐 · 王翰',lines:['葡萄美酒夜光杯，','欲饮琵琶马上催。','醉卧沙场君莫笑，','古来征战几人回？']},
{title:'夏日绝句',author:'宋 · 李清照',lines:['生当作人杰，','死亦为鬼雄。','至今思项羽，','不肯过江东。']},
{title:'别董大',author:'唐 · 高适',lines:['千里黄云白日曛，','北风吹雁雪纷纷。','莫愁前路无知己，','天下谁人不识君？']}
]},
{grade:'四年级下册',poems:[
{title:'四时田园杂兴（其二十五）',author:'宋 · 范成大',lines:['梅子金黄杏子肥，','麦花雪白菜花稀。','日长篱落无人过，','惟有蜻蜓蛱蝶飞。']},
{title:'宿新市徐公店',author:'宋 · 杨万里',lines:['篱落疏疏一径深，','树头新绿未成阴。','儿童急走追黄蝶，','飞入菜花无处寻。']},
{title:'清平乐·村居',author:'宋 · 辛弃疾',lines:['茅檐低小，溪上青青草。','醉里吴音相媚好，','白发谁家翁媪？','大儿锄豆溪东，','中儿正织鸡笼。','最喜小儿亡赖，','溪头卧剥莲蓬。']},
{title:'江畔独步寻花',author:'唐 · 杜甫',lines:['黄师塔前江水东，','春光懒困倚微风。','桃花一簇开无主，','可爱深红爱浅红？']},
{title:'蜂',author:'唐 · 罗隐',lines:['不论平地与山尖，','无限风光尽被占。','采得百花成蜜后，','为谁辛苦为谁甜？']},
{title:'独坐敬亭山',author:'唐 · 李白',lines:['众鸟高飞尽，','孤云独去闲。','相看两不厌，','只有敬亭山。']},
{title:'芙蓉楼送辛渐',author:'唐 · 王昌龄',lines:['寒雨连江夜入吴，','平明送客楚山孤。','洛阳亲友如相问，','一片冰心在玉壶。']},
{title:'塞下曲',author:'唐 · 卢纶',lines:['月黑雁飞高，','单于夜遁逃。','欲将轻骑逐，','大雪满弓刀。']},
{title:'墨梅',author:'元 · 王冕',lines:['吾家洗砚池头树，','朵朵花开淡墨痕。','不要人夸好颜色，','只留清气满乾坤。']}
]},
{grade:'五年级上册',poems:[
{title:'蝉',author:'唐 · 虞世南',lines:['垂緌饮清露，','流响出疏桐。','居高声自远，','非是藉秋风。']},
{title:'乞巧',author:'唐 · 林杰',lines:['七夕今宵看碧霄，','牵牛织女渡河桥。','家家乞巧望秋月，','穿尽红丝几万条。']},
{title:'示儿',author:'宋 · 陆游',lines:['死去元知万事空，','但悲不见九州同。','王师北定中原日，','家祭无忘告乃翁。']},
{title:'题临安邸',author:'宋 · 林升',lines:['山外青山楼外楼，','西湖歌舞几时休？','暖风熏得游人醉，','直把杭州作汴州。']},
{title:'己亥杂诗',author:'清 · 龚自珍',lines:['九州生气恃风雷，','万马齐喑究可哀。','我劝天公重抖擞，','不拘一格降人材。']},
{title:'山居秋暝',author:'唐 · 王维',lines:['空山新雨后，','天气晚来秋。','明月松间照，','清泉石上流。','竹喧归浣女，','莲动下渔舟。','随意春芳歇，','王孙自可留。']},
{title:'枫桥夜泊',author:'唐 · 张继',lines:['月落乌啼霜满天，','江枫渔火对愁眠。','姑苏城外寒山寺，','夜半钟声到客船。']},
{title:'长相思',author:'清 · 纳兰性德',lines:['山一程，水一程，','身向榆关那畔行，','夜深千帐灯。','风一更，雪一更，','聒碎乡心梦不成，','故园无此声。']},
{title:'渔歌子',author:'唐 · 张志和',lines:['西塞山前白鹭飞，','桃花流水鳜鱼肥。','青箬笠，绿蓑衣，','斜风细雨不须归。']},
{title:'观书有感（其一）',author:'宋 · 朱熹',lines:['半亩方塘一鉴开，','天光云影共徘徊。','问渠那得清如许？','为有源头活水来。']},
{title:'观书有感（其二）',author:'宋 · 朱熹',lines:['昨夜江边春水生，','蒙冲巨舰一毛轻。','向来枉费推移力，','此日中流自在行。']}
]},
{grade:'五年级下册',poems:[
{title:'四时田园杂兴（其三十一）',author:'宋 · 范成大',lines:['昼出耘田夜绩麻，','村庄儿女各当家。','童孙未解供耕织，','也傍桑阴学种瓜。']},
{title:'稚子弄冰',author:'宋 · 杨万里',lines:['稚子金盆脱晓冰，','彩丝穿取当银钲。','敲成玉磬穿林响，','忽作玻璃碎地声。']},
{title:'村晚',author:'宋 · 雷震',lines:['草满池塘水满陂，','山衔落日浸寒漪。','牧童归去横牛背，','短笛无腔信口吹。']},
{title:'游子吟',author:'唐 · 孟郊',lines:['慈母手中线，','游子身上衣。','临行密密缝，','意恐迟迟归。','谁言寸草心，','报得三春晖。']},
{title:'鸟鸣涧',author:'唐 · 王维',lines:['人闲桂花落，','夜静春山空。','月出惊山鸟，','时鸣春涧中。']},
{title:'从军行',author:'唐 · 王昌龄',lines:['青海长云暗雪山，','孤城遥望玉门关。','黄沙百战穿金甲，','不破楼兰终不还。']},
{title:'秋夜将晓出篱门迎凉有感',author:'宋 · 陆游',lines:['三万里河东入海，','五千仞岳上摩天。','遗民泪尽胡尘里，','南望王师又一年。']},
{title:'闻官军收河南河北',author:'唐 · 杜甫',lines:['剑外忽传收蓟北，','初闻涕泪满衣裳。','却看妻子愁何在，','漫卷诗书喜欲狂。','白日放歌须纵酒，','青春作伴好还乡。','即从巴峡穿巫峡，','便下襄阳向洛阳。']},
{title:'凉州词',author:'唐 · 王之涣',lines:['黄河远上白云间，','一片孤城万仞山。','羌笛何须怨杨柳，','春风不度玉门关。']},
{title:'黄鹤楼送孟浩然之广陵',author:'唐 · 李白',lines:['故人西辞黄鹤楼，','烟花三月下扬州。','孤帆远影碧空尽，','唯见长江天际流。']},
{title:'乡村四月',author:'宋 · 翁卷',lines:['绿遍山原白满川，','子规声里雨如烟。','乡村四月闲人少，','才了蚕桑又插田。']}
]},
{grade:'六年级上册',poems:[
{title:'宿建德江',author:'唐 · 孟浩然',lines:['移舟泊烟渚，','日暮客愁新。','野旷天低树，','江清月近人。']},
{title:'六月二十七日望湖楼醉书',author:'宋 · 苏轼',lines:['黑云翻墨未遮山，','白雨跳珠乱入船。','卷地风来忽吹散，','望湖楼下水如天。']},
{title:'西江月·夜行黄沙道中',author:'宋 · 辛弃疾',lines:['明月别枝惊鹊，','清风半夜鸣蝉。','稻花香里说丰年，','听取蛙声一片。','七八个星天外，','两三点雨山前。','旧时茅店社林边，','路转溪桥忽见。']},
{title:'过故人庄',author:'唐 · 孟浩然',lines:['故人具鸡黍，','邀我至田家。','绿树村边合，','青山郭外斜。','开轩面场圃，','把酒话桑麻。','待到重阳日，','还来就菊花。']},
{title:'春日',author:'宋 · 朱熹',lines:['胜日寻芳泗水滨，','无边光景一时新。','等闲识得东风面，','万紫千红总是春。']},
{title:'回乡偶书',author:'唐 · 贺知章',lines:['少小离家老大回，','乡音无改鬓毛衰。','儿童相见不相识，','笑问客从何处来。']},
{title:'浪淘沙（其一）',author:'唐 · 刘禹锡',lines:['九曲黄河万里沙，','浪淘风簸自天涯。','如今直上银河去，','同到牵牛织女家。']},
{title:'江南春',author:'唐 · 杜牧',lines:['千里莺啼绿映红，','水村山郭酒旗风。','南朝四百八十寺，','多少楼台烟雨中。']},
{title:'书湖阴先生壁',author:'宋 · 王安石',lines:['茅檐长扫净无苔，','花木成畦手自栽。','一水护田将绿绕，','两山排闼送青来。']}
]},
{grade:'六年级下册',poems:[
{title:'寒食',author:'唐 · 韩翃',lines:['春城无处不飞花，','寒食东风御柳斜。','日暮汉宫传蜡烛，','轻烟散入五侯家。']},
{title:'迢迢牵牛星',author:'古诗十九首',lines:['迢迢牵牛星，','皎皎河汉女。','纤纤擢素手，','札札弄机杼。','终日不成章，','泣涕零如雨。','河汉清且浅，','相去复几许。','盈盈一水间，','脉脉不得语。']},
{title:'十五夜望月',author:'唐 · 王建',lines:['中庭地白树栖鸦，','冷露无声湿桂花。','今夜月明人尽望，','不知秋思落谁家。']},
{title:'长歌行',author:'汉乐府',lines:['青青园中葵，','朝露待日晞。','阳春布德泽，','万物生光辉。','常恐秋节至，','焜黄华叶衰。','百川东到海，','何时复西归？','少壮不努力，','老大徒伤悲！']},
{title:'马诗',author:'唐 · 李贺',lines:['大漠沙如雪，','燕山月似钩。','何当金络脑，','快走踏清秋。']},
{title:'石灰吟',author:'明 · 于谦',lines:['千锤万凿出深山，','烈火焚烧若等闲。','粉骨碎身浑不怕，','要留清白在人间。']},
{title:'竹石',author:'清 · 郑燮',lines:['咬定青山不放松，','立根原在破岩中。','千磨万击还坚劲，','任尔东西南北风。']},
{title:'采薇（节选）',author:'《诗经》',lines:['昔我往矣，','杨柳依依。','今我来思，','雨雪霏霏。','行道迟迟，','载渴载饥。','我心伤悲，','莫知我哀！']},
{title:'送元二使安西',author:'唐 · 王维',lines:['渭城朝雨浥轻尘，','客舍青青柳色新。','劝君更尽一杯酒，','西出阳关无故人。']},
{title:'春夜喜雨',author:'唐 · 杜甫',lines:['好雨知时节，','当春乃发生。','随风潜入夜，','润物细无声。','野径云俱黑，','江船火独明。','晓看红湿处，','花重锦官城。']},
{title:'早春呈水部张十八员外',author:'唐 · 韩愈',lines:['天街小雨润如酥，','草色遥看近却无。','最是一年春好处，','绝胜烟柳满皇都。']},
{title:'江上渔者',author:'宋 · 范仲淹',lines:['江上往来人，','但爱鲈鱼美。','君看一叶舟，','出没风波里。']},
{title:'泊船瓜洲',author:'宋 · 王安石',lines:['京口瓜洲一水间，','钟山只隔数重山。','春风又绿江南岸，','明月何时照我还。']},
{title:'游园不值',author:'宋 · 叶绍翁',lines:['应怜屐齿印苍苔，','小扣柴扉久不开。','春色满园关不住，','一枝红杏出墙来。']},
{title:'卜算子·送鲍浩然之浙东',author:'宋 · 王观',lines:['水是眼波横，','山是眉峰聚。','欲问行人去那边？','眉眼盈盈处。','才始送春归，','又送君归去。','若到江南赶上春，','千万和春住。']},
{title:'浣溪沙',author:'宋 · 苏轼',lines:['游蕲水清泉寺，','寺临兰溪，溪水西流。','山下兰芽短浸溪，','松间沙路净无泥，','萧萧暮雨子规啼。','谁道人生无再少？','门前流水尚能西！','休将白发唱黄鸡。']},
{title:'清平乐·春归何处',author:'宋 · 黄庭坚',lines:['春归何处？','寂寞无行路。','若有人知春去处，','唤取归来同住。','春无踪迹谁知？','除非问取黄鹂。','百啭无人能解，','因风飞过蔷薇。']}
]}
];

// 数学 - 数字 0~20
var numCn=['零','一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十'];
var numbers=[];
for(var i=0;i<=20;i++){
    var dots='';
    if(i>=1&&i<=9){dots=Array(i+1).join('●')}
    else if(i>=11&&i<=19){dots='10 + '+(i-10)}
    else if(i===10||i===20){dots=''}
    else if(i===0){dots='没有东西'}
    numbers.push({num:i,cn:numCn[i],dots:dots});
}

// 数字转中文（0~99）
function numToCn(n){
    if(n===10) return '一十';
    if(n<=20) return numCn[n];
    var tens=Math.floor(n/10),ones=n%10;
    if(ones===0) return numCn[tens]+'十';
    return numCn[tens]+'十'+numCn[ones];
}

// ==================== 语音 ====================
function speak(text,lang){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang=lang||'en-US';u.rate=lang==='zh-CN'?0.7:0.8;u.pitch=1.1;
    var voices=speechSynthesis.getVoices();
    var v=voices.find(function(x){return x.lang.startsWith(lang||'en')})||null;
    if(v) u.voice=v;
    speechSynthesis.speak(u);
}
window.speak=speak;

// ==================== Hanzi Writer 笔画动画 ====================
var currentWriter=null;

function initHanziWriter(char, strokeCount){
    // 先销毁旧实例
    if(currentWriter){try{currentWriter.target.innerHTML=''}catch(e){};currentWriter=null}
    var wrap=document.getElementById('hwWrap');
    if(!wrap) return;
    wrap.querySelector('.hw-inner').innerHTML='';
    var hwOpts={width:200,height:200,padding:5,showOutline:true,strokeAnimationSpeed:1,delayBetweenStrokes:600,strokeColor:'#E85D5D',radicalColor:'#E85D5D',outlineColor:'#DDD',highlightColor:'#AAF',drawingColor:'#333'};
    currentWriter=HanziWriter.create(wrap.querySelector('.hw-inner'),char,hwOpts);
    // 设置步骤点
    var stepDiv=wrap.querySelector('.hw-step');
    stepDiv.innerHTML='';
    for(var i=0;i<strokeCount;i++){var d=document.createElement('span');d.className='step-dot done';d.textContent=i+1;stepDiv.appendChild(d)}
}

function startStrokeAnim(){
    if(!currentWriter) return;
    // 重置步骤点
    var dots=document.querySelectorAll('#hwWrap .step-dot');
    dots.forEach(function(d){d.className='step-dot'});
    // 先隐藏，再动画
    currentWriter.hideCharacter({duration:200}).then(function(){
        // 启动步骤指示器
        var step=0,total=dots.length;
        var interval=setInterval(function(){
            dots.forEach(function(d){d.className='step-dot'});
            for(var j=0;j<step;j++){if(dots[j]) dots[j].className='step-dot done'}
            if(dots[step]) dots[step].className='step-dot current';
            step++;
            if(step>=total){clearInterval(interval);
                setTimeout(function(){dots.forEach(function(d){d.className='step-dot done'})},600)}
        },600);
        currentWriter.animateCharacter({onComplete:function(){clearInterval(interval);dots.forEach(function(d){d.className='step-dot done'})}});
    });
}

// ==================== 弹窗 ====================
var currentModalData=null;

function showModal(data){
    currentModalData=data;
    var isChar=!!data.ch;
    var body=Q('modalBody');
    var html='';

    if(isChar){
        html+='<div class="modal-char">'+data.ch+'</div>';
        if(data.picto){
            html+='<div class="modal-picto"><span>'+data.picto+'</span><span class="arrow">➡️</span><span style="font-weight:900;color:var(--red)">'+data.ch+'</span></div>';
            html+='<div class="modal-picto-label">象形演变</div>';
        }
        html+='<div class="modal-pinyin">'+data.py+'</div>';
        html+='<div class="modal-meaning">'+data.m+'</div>';

        // Hanzi Writer 笔画区
        html+='<div class="hw-wrap" id="hwWrap"><div class="hw-inner"></div></div>';
        html+='<div class="hw-step"></div>';
        html+='<div class="hw-btns"><button class="hw-btn write">✏️ 写一遍</button><button class="hw-btn replay">🔄 重写</button></div>';
        html+='<button class="modal-speak cn">🔊 听发音</button>';
    }else{
        html+='<div class="modal-emoji">'+(data.emoji||'')+'</div>';
        html+='<div class="modal-word">'+data.word+'</div>';
        html+='<div class="modal-meaning">'+data.m+'</div>';
        html+='<button class="modal-speak en">🔊 听发音</button>';
    }

    body.innerHTML=html;
    Q('modalOverlay').classList.add('show');

    // 绑定按钮事件（避免 inline onclick 在 IIFE 中失效）
    body.querySelectorAll('.hw-btn').forEach(function(btn){btn.addEventListener('click',startStrokeAnim)});
    var speakBtn=body.querySelector('.modal-speak');
    if(speakBtn){
        var lang=isChar?'zh-CN':'en-US';
        var text=isChar?data.ch:data.word;
        speakBtn.addEventListener('click',function(){speak(text,lang)});
    }

    if(isChar){
        setTimeout(function(){initHanziWriter(data.ch,data.n)},200);
    }

    if(isChar) speak(data.ch,'zh-CN');
    else speak(data.word,'en-US');
}

        c.innerHTML='<div class="arith-pic" style="font-size:15px;color:#94A3B8;min-height:20px">'+(item.op==='+'?'凑十法':'破十法')+'</div><div class="arith-expr">'+item.a+' '+item.op+' '+item.b+' = ?</div><div class="arith-answer">'+ans+'</div>';
        c.addEventListener('click',function(){speak(item.a+' '+item.op+' '+item.b+' 等于 '+numToCn(ans),'zh-CN')});
        g.appendChild(c);
    });
}

function clockSVG(h,m){
    var nums='';
    for(var i=1;i<=12;i++){
        var ang=(i*30-90)*Math.PI/180;
        var x=50+37*Math.cos(ang), y=50+37*Math.sin(ang);
        nums+='<text x="'+x.toFixed(1)+'" y="'+(y+3.8).toFixed(1)+'" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">'+i+'</text>';
    }
    var hA=((h%12)*30+m*0.5);
    var mA=m*6;
    return '<svg viewBox="0 0 100 100" width="92" height="92">'+
        '<circle cx="50" cy="50" r="46" fill="#FFFFFF" stroke="#0E9F6E" stroke-width="3"/>'+
        nums+
        '<line x1="50" y1="50" x2="50" y2="32" stroke="#334155" stroke-width="4.5" stroke-linecap="round" transform="rotate('+hA+' 50 50)"/>'+
        '<line x1="50" y1="50" x2="50" y2="19" stroke="#0E9F6E" stroke-width="2.5" stroke-linecap="round" transform="rotate('+mA+' 50 50)"/>'+
        '<circle cx="50" cy="50" r="3.8" fill="#0E9F6E"/></svg>';
}

var mqCur=0,mqScore=0;
function initMathQuiz(){
    mqCur=0;mqScore=0;
    Q('mathQuizScore').textContent='0';Q('mathQuizFeedback').textContent='';Q('mathQuizNext').style.display='none';
    mathNext();
}
function mathNext(){
    if(mqCur>=10){Q('mathQuizExpr').textContent='🏆';Q('mathQuizOptions').innerHTML='';Q('mathQuizFeedback').textContent='你得了 '+mqScore+' / 10 分！';Q('mathQuizNext').style.display='block';Q('mathQuizNext').textContent='🔄 再来一次';Q('mathQuizNext').onclick=function(){mqCur=0;mqScore=0;Q('mathQuizScore').textContent='0';Q('mathQuizFeedback').textContent='';mathNext()};return}
    Q('mathQuizNext').style.display='none';Q('mathQuizFeedback').textContent='';Q('mathQuizNext').textContent='下一题 ➡️';Q('mathQuizNext').onclick=mathNext;
    // 随机混合题型：10以内加减 / 20以内加减 / 乘法口诀
    var type=Math.floor(Math.random()*3);
    var expr,ans;
    if(type===0){
        var isAdd=Math.random()<0.6;
        var a,b;
        if(isAdd){a=Math.floor(Math.random()*9)+1;b=Math.floor(Math.random()*(10-a))+1;ans=a+b}
        else{a=Math.floor(Math.random()*9)+2;b=Math.floor(Math.random()*(a-1))+1;ans=a-b}
        expr=a+' '+(isAdd?'+':'-')+' '+b;
    }else if(type===1){
        var it=arith20[Math.floor(Math.random()*arith20.length)];
        ans=it.op==='+'?it.a+it.b:it.a-it.b;
        expr=it.a+' '+it.op+' '+it.b;
    }else{
        var tm=timesTable[Math.floor(Math.random()*timesTable.length)];
        ans=tm.ans;
        expr=tm.a+' × '+tm.b;
    }
    Q('mathQuizExpr').textContent=expr+' = ?';
    // 生成选项
    var opts=[ans];
    while(opts.length<4){var cand=ans+(Math.floor(Math.random()*9)-4);if(cand<0) continue;if(opts.indexOf(cand)===-1) opts.push(cand)}
    shuffle(opts);
    var oc=Q('mathQuizOptions');oc.innerHTML='';
    opts.forEach(function(opt){
        var btn=document.createElement('button');btn.className='math-quiz-opt';btn.textContent=opt;
        btn.addEventListener('click',function(){
            if(oc.dataset.done==='1') return;oc.dataset.done='1';
            if(opt===ans){btn.classList.add('correct');Q('mathQuizFeedback').textContent='✅ 太棒了！';Q('mathQuizFeedback').style.color='var(--green)';mqScore++;Q('mathQuizScore').textContent=mqScore}
            else{btn.classList.add('wrong');Q('mathQuizFeedback').textContent='❌ 答案是：'+ans;Q('mathQuizFeedback').style.color='var(--pink)';oc.querySelectorAll('.math-quiz-opt').forEach(function(b){if(+b.textContent===ans) b.classList.add('correct')})}
            speak(numToCn(ans),'zh-CN');mqCur++;Q('mathQuizNext').style.display='inline-block';
        });
        oc.appendChild(btn);
    });
    oc.dataset.done='0';
}

function initMathTabs(){
    Q('mathTabBar').querySelectorAll('.tab').forEach(function(tab){
        tab.addEventListener('click',function(){
            var t=this.dataset.math;
            Q('mathTabBar').querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});
            Q('panelMath').querySelectorAll('.tab-panel').forEach(function(x){x.classList.remove('active')});
            this.classList.add('active');Q('math-'+t).classList.add('active');
            if(t==='mquiz') initMathQuiz();
        });
    });
}
